<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ガクコマ そうじゅう</title>
<style>
  :root { --gap: 12px; }
  * { box-sizing: border-box; margin: 0; padding: 0;
      -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; overscroll-behavior: none;
      touch-action: none; background: #0d1b2a;
      font-family: -apple-system, "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif; color: #fff; }
  #app { position: fixed; inset: 0; display: flex; flex-direction: column; gap: var(--gap); padding: var(--gap);
      touch-action: none; }
  #panes { flex: 1 1 0; min-height: 0; display: flex; flex-direction: row; gap: var(--gap); touch-action: none; }

  .zone { position: relative; flex: 1 1 0; border-radius: 24px; overflow: hidden;
      display: flex; align-items: center; justify-content: center; touch-action: none; }
  #drive { background: radial-gradient(circle at 50% 50%, #1b3a5b 0%, #12283f 70%); }
  #head  { background: radial-gradient(circle at 50% 50%, #3a2b5b 0%, #241a3f 70%); }

  .label { position: absolute; top: 14px; left: 0; right: 0; text-align: center;
      font-size: 20px; font-weight: 700; opacity: .55; letter-spacing: .1em; pointer-events: none; }

  /* joystick */
  #stickBase { width: 62%; aspect-ratio: 1/1; max-width: 340px; max-height: 72%; border-radius: 50%;
      background: rgba(255,255,255,.06); border: 3px solid rgba(255,255,255,.16);
      position: relative; touch-action: none; }
  #stickBase .cross { position: absolute; inset: 0; opacity: .18; pointer-events: none; }
  #knob { position: absolute; width: 42%; height: 42%; left: 29%; top: 29%; border-radius: 50%;
      background: radial-gradient(circle at 40% 35%, #7fd7ff, #2196c9);
      box-shadow: 0 6px 16px rgba(0,0,0,.4); transition: transform .05s linear; }
  #knob.pressed { background: radial-gradient(circle at 40% 35%, #b6ffb0, #2fbf3f); }

  /* head pad */
  #headPad { width: 82%; height: 74%; border-radius: 20px; position: relative;
      background: rgba(255,255,255,.05); border: 3px solid rgba(255,255,255,.14); touch-action: none; }
  #headDot { position: absolute; width: 46px; height: 46px; margin: -23px 0 0 -23px; left: 50%; top: 50%;
      border-radius: 50%; background: radial-gradient(circle at 40% 35%, #ffd479, #e8892b);
      box-shadow: 0 4px 12px rgba(0,0,0,.4); }
  #headPad .hint { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      font-size: 60px; opacity: .12; pointer-events: none; }

  #frontBtn { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
      padding: 12px 26px; border: none; border-radius: 40px; font-size: 20px; font-weight: 700;
      background: #6a53a8; color: #fff; touch-action: none; }
  #frontBtn:active { background: #7f66c4; }

  /* emergency stop */
  #stop { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 30;
      width: 108px; height: 108px; border-radius: 50%; border: 6px solid #fff;
      background: radial-gradient(circle at 42% 38%, #ff6a6a, #c40000);
      color: #fff; font-size: 30px; font-weight: 800; box-shadow: 0 8px 22px rgba(0,0,0,.5);
      touch-action: none; }
  #stop:active { background: radial-gradient(circle at 42% 38%, #ff9a9a, #e00000); }

  /* connection overlay */
  #overlay { position: fixed; inset: 0; z-index: 100; display: none;
      align-items: center; justify-content: center; flex-direction: column; gap: 18px;
      background: rgba(150,0,0,.92); text-align: center; padding: 24px; }
  #overlay.show { display: flex; }
  #overlay .big { font-size: 64px; }
  #overlay .msg { font-size: 26px; font-weight: 700; }
  #overlay .sub { font-size: 18px; opacity: .85; }

  #dot { position: fixed; top: 10px; right: 14px; z-index: 40; width: 16px; height: 16px;
      border-radius: 50%; background: #888; box-shadow: 0 0 8px rgba(0,0,0,.5); }
  #dot.on { background: #2fdd5a; }

  /* 視界（画面上部1/3に常設・カメラ無し/読み込み失敗で非表示→操作エリアが全面に広がる） */
  #view { flex: 0 0 33%; min-height: 0; width: 100%; border-radius: 18px; overflow: hidden; background: #000;
      border: 2px solid rgba(255,255,255,.35); box-shadow: 0 4px 14px rgba(0,0,0,.5); touch-action: none; }
  #view.hide { display: none; }
  #view img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
</style>
</head>
<body>
<div id="app">
  <div id="view" class="hide"><img id="viewImg" alt=""></div>
  <div id="panes">
    <div id="drive" class="zone">
      <div class="label">はしる</div>
      <div id="stickBase">
        <svg class="cross" viewBox="0 0 100 100"><line x1="50" y1="6" x2="50" y2="94" stroke="#fff" stroke-width="1.5"/><line x1="6" y1="50" x2="94" y2="50" stroke="#fff" stroke-width="1.5"/></svg>
        <div id="knob"></div>
      </div>
    </div>
    <div id="head" class="zone">
      <div class="label">くび</div>
      <div id="headPad">
        <div class="hint">&#128064;</div>
        <div id="headDot"></div>
      </div>
      <button id="frontBtn" type="button">しょうめん</button>
    </div>
  </div>
</div>

<button id="stop" type="button">STOP</button>
<div id="dot"></div>

<div id="overlay">
  <div class="big">&#128268;</div>
  <div class="msg">つながっていません</div>
  <div class="sub">じどうで さいせつぞく します…</div>
</div>

<script>
"use strict";
(function () {
  var MAX = 100;          // サーバ側で max_speed にクランプされる
  var SEND_MS = 100;      // 約10Hz

  // ---- WebSocket ----------------------------------------------------------
  var ws = null, wsReady = false, reconnectTimer = null;
  var overlay = document.getElementById("overlay");
  var dot = document.getElementById("dot");

  function setConnected(ok) {
    wsReady = ok;
    overlay.classList.toggle("show", !ok);
    dot.classList.toggle("on", ok);
  }

  function connect() {
    try {
      ws = new WebSocket("ws://" + location.host + "/");
    } catch (e) { scheduleReconnect(); return; }
    ws.onopen = function () { setConnected(true); };
    ws.onclose = function () { setConnected(false); scheduleReconnect(); };
    ws.onerror = function () { try { ws.close(); } catch (e) {} };
    ws.onmessage = function () { /* 状態応答は今は表示に使わない */ };
  }
  function scheduleReconnect() {
    if (reconnectTimer) return;
    reconnectTimer = setTimeout(function () {
      reconnectTimer = null;
      connect();
    }, 800);
  }
  function send(obj) {
    if (ws && wsReady && ws.readyState === 1) {
      try { ws.send(JSON.stringify(obj)); } catch (e) {}
    }
  }
  connect();

  // ---- 走行ジョイスティック ----------------------------------------------
  var stickBase = document.getElementById("stickBase");
  var knob = document.getElementById("knob");
  var driveActive = false, driveVec = { x: 0, y: 0 }, driveTimer = null;

  function updateKnob() {
    var r = stickBase.clientWidth * 0.29; // 可動半径（基準％に合わせる）
    knob.style.transform = "translate(" + (driveVec.x * r) + "px," + (-driveVec.y * r) + "px)";
  }
  function computeVec(ev) {
    var rect = stickBase.getBoundingClientRect();
    var cx = rect.left + rect.width / 2, cy = rect.top + rect.height / 2;
    var dx = (ev.clientX - cx) / (rect.width / 2);
    var dy = (ev.clientY - cy) / (rect.height / 2);
    var mag = Math.hypot(dx, dy);
    if (mag > 1) { dx /= mag; dy /= mag; }
    driveVec.x = dx;        // 右が +（旋回）
    driveVec.y = -dy;       // 上が +（前進）
  }
  function sendDrive() {
    // 差動ミキシング: 前後=y, 旋回=x
    var l = driveVec.y + driveVec.x;
    var r = driveVec.y - driveVec.x;
    var m = Math.max(1, Math.abs(l), Math.abs(r));
    l = Math.round((l / m) * Math.min(1, Math.hypot(driveVec.x, driveVec.y)) * MAX);
    r = Math.round((r / m) * Math.min(1, Math.hypot(driveVec.x, driveVec.y)) * MAX);
    send({ type: "drive", left: l, right: r });
  }
  function driveStart(ev) {
    driveActive = true;
    knob.classList.add("pressed");
    try { stickBase.setPointerCapture(ev.pointerId); } catch (e) {}
    computeVec(ev); updateKnob(); sendDrive();
    if (!driveTimer) driveTimer = setInterval(function () { if (driveActive) sendDrive(); }, SEND_MS);
    ev.preventDefault();
  }
  function driveMove(ev) {
    if (!driveActive) return;
    computeVec(ev); updateKnob();
    ev.preventDefault();
  }
  function driveEnd(ev) {
    if (!driveActive) return;
    driveActive = false;
    knob.classList.remove("pressed");
    driveVec.x = 0; driveVec.y = 0; updateKnob();
    send({ type: "drive", left: 0, right: 0 }); // 離した瞬間に停止
    if (ev) ev.preventDefault();
  }
  stickBase.addEventListener("pointerdown", driveStart);
  stickBase.addEventListener("pointermove", driveMove);
  stickBase.addEventListener("pointerup", driveEnd);
  stickBase.addEventListener("pointercancel", driveEnd);
  stickBase.addEventListener("pointerleave", driveEnd);

  // ---- 首パッド（絶対角） --------------------------------------------------
  var headPad = document.getElementById("headPad");
  var headDot = document.getElementById("headDot");
  var headActive = false, headLast = 0;

  function sendHead(ev) {
    var rect = headPad.getBoundingClientRect();
    var fx = (ev.clientX - rect.left) / rect.width;   // 0(左)..1(右)
    var fy = (ev.clientY - rect.top) / rect.height;   // 0(上)..1(下)
    fx = Math.max(0, Math.min(1, fx));
    fy = Math.max(0, Math.min(1, fy));
    headDot.style.left = (fx * 100) + "%";
    headDot.style.top = (fy * 100) + "%";
    // 操縦者はロボットの後ろから見る前提（走行ジョイスティックと同じ視点）。
    // 既存 servo/pan_tilt.py の direction_map は 右=pan45(小角度)/左=pan_max(大角度)、
    // すなわち pan小=ロボットの右。よって パッド右端(fx=1)→pan=10(右)/左端(fx=0)→pan=170(左)。
    var pan = Math.round(170 - fx * 160);  // pan 170(左)..10(右)
    var tilt = Math.round(40 + fy * 80);   // tilt 40(上)..120(下)
    var now = Date.now();
    if (now - headLast >= SEND_MS) { headLast = now; send({ type: "head", pan: pan, tilt: tilt }); }
  }
  headPad.addEventListener("pointerdown", function (ev) {
    headActive = true;
    try { headPad.setPointerCapture(ev.pointerId); } catch (e) {}
    sendHead(ev); ev.preventDefault();
  });
  headPad.addEventListener("pointermove", function (ev) {
    if (headActive) { sendHead(ev); ev.preventDefault(); }
  });
  function headEnd(ev) { headActive = false; if (ev) ev.preventDefault(); }
  headPad.addEventListener("pointerup", headEnd);
  headPad.addEventListener("pointercancel", headEnd);

  document.getElementById("frontBtn").addEventListener("pointerdown", function (ev) {
    headDot.style.left = "50%"; headDot.style.top = "50%";
    send({ type: "head", pan: 90, tilt: 90 });
    ev.preventDefault(); ev.stopPropagation();
  });

  // ---- 緊急停止 ------------------------------------------------------------
  document.getElementById("stop").addEventListener("pointerdown", function (ev) {
    driveEnd(null);
    send({ type: "stop" });
    send({ type: "drive", left: 0, right: 0 });
    ev.preventDefault();
  });

  // ---- ピンチズーム / ダブルタップズーム / スクロール抑止 -----------------
  document.addEventListener("gesturestart", function (e) { e.preventDefault(); });
  document.addEventListener("touchmove", function (e) { e.preventDefault(); }, { passive: false });
  document.addEventListener("dblclick", function (e) { e.preventDefault(); });
  window.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  window.addEventListener("resize", updateKnob);

  // ---- 視界（任意機能・操縦を阻害しない） --------------------------------
  // MJPEG(<img src="/stream">)。読み込めれば画面上部1/3に表示、
  // 失敗/カメラ無しなら自動で隠して操作エリアを全面に広げる。
  // 映像処理はブラウザ任せでイベントループを塞がない。
  var view = document.getElementById("view");
  var viewImg = document.getElementById("viewImg");
  var viewLoaded = false;
  var viewTimer = setTimeout(function () {
    if (!viewLoaded) view.classList.add("hide");   // 一定時間フレームが来なければ隠す
  }, 4000);
  viewImg.addEventListener("load", function () {
    viewLoaded = true; view.classList.remove("hide");
  });
  viewImg.addEventListener("error", function () { view.classList.add("hide"); });
  viewImg.src = "/stream";
})();
</script>
</body>
</html>
